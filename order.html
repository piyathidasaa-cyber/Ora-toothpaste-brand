<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — Ora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Ora</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">

        <div class="section-head">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อ</h1>
          <hr class="divider center">
          <p>กรอกข้อมูลด้านล่าง ทีมงานจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm">

          <div class="form-field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required autocomplete="name">
          </div>

          <div class="form-field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required autocomplete="tel">
          </div>

          <div class="form-field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" required>
          </div>

          <div class="form-field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="ที่อยู่จัดส่งหรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn--solid btn--block mt-3">ยืนยันสั่งซื้อ</button>

        </form>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <a class="logo" href="index.html">Ora</a>
      <div class="footer-bottom">&copy; Ora. All rights reserved.</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
